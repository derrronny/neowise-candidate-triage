<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
    #result { margin-top: 1rem; }
    #result:empty { display: none; }
    #error { color: #b00020; }
    #error:empty { display: none; }
    #topic { margin: .5rem 0; }
    #draft { box-sizing: border-box; width: 100%; padding: .5rem; font: inherit; }
    .manual { padding: .5rem; background: #fff3cd; border: 1px solid #e0c060; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="error" role="alert"></p>
  <div id="result" aria-live="polite"></div>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const error = document.querySelector("#error");
    const result = document.querySelector("#result");

    const TOPIC_LABELS = {
      delivery: "Доставка",
      pricing: "Цены",
      other: "Другое",
    };

    function clearResult() {
      result.textContent = "";
    }

    function showReady(topic, draft) {
      clearResult();
      const topicEl = document.createElement("p");
      topicEl.id = "topic";
      topicEl.textContent = `Тема: ${TOPIC_LABELS[topic] ?? topic}`;
      const label = document.createElement("label");
      label.htmlFor = "draft";
      label.textContent = "Черновик ответа (проверьте перед отправкой):";
      const draftEl = document.createElement("textarea");
      draftEl.id = "draft";
      draftEl.rows = 5;
      draftEl.value = draft;
      result.append(topicEl, label, draftEl);
    }

    function showManualReview() {
      clearResult();
      const note = document.createElement("p");
      note.className = "manual";
      note.textContent = "Автоматический разбор не сработал. Разберите заявку вручную.";
      result.append(note);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      clearResult();
      button.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        const data = await reply.json();
        if (reply.status === 200 && data.status === "ready") {
          showReady(data.topic, data.draft);
        } else if (reply.status === 200 && data.status === "manual_review") {
          showManualReview();
        } else if (reply.status === 400) {
          error.textContent = "Введите текст заявки.";
        } else {
          error.textContent = "Не удалось разобрать заявку. Попробуйте ещё раз.";
        }
      } catch {
        error.textContent = "Нет связи с сервером. Попробуйте ещё раз.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
